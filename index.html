<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シマフクロウ カーソル追従</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="viewCanvas" aria-label="カーソル方向を向くシマフクロウ"></canvas>
<script>
(() => {
'use strict';
const FRAME_COUNT = 92;
const DPR_LIMIT = 2;
const SMOOTH_TIME = 0.14; // 追従の滑らかさ（秒）。大きいほどゆったり追いかける
// 各フレームまでの「首の動き」の累積（0〜1）。フクロウの頭部だけの差分から算出し、
// 背景のちらつきの影響を除いている。完全に同じ絵が続く静止区間（14〜21枚目、
// 正面の50〜56枚目、85〜92枚目）は幅0にして、カーソル移動で止まらず通過させる。
const ARC = [0.0000,0.0112,0.0211,0.0294,0.0392,0.0483,0.0560,0.0626,0.0736,0.0841,0.0965,0.1093,0.1227,0.1310,0.1310,0.1310,0.1310,0.1310,0.1310,0.1310,0.1310,0.1376,0.1518,0.1670,0.1820,0.1948,0.2110,0.2261,0.2335,0.2494,0.2657,0.2833,0.2985,0.3148,0.3303,0.3410,0.3579,0.3745,0.3907,0.4068,0.4235,0.4403,0.4506,0.4663,0.4822,0.4974,0.5157,0.5315,0.5474,0.5537,0.5537,0.5537,0.5537,0.5537,0.5537,0.5537,0.5571,0.5737,0.5893,0.6073,0.6248,0.6424,0.6586,0.6682,0.6849,0.7010,0.7177,0.7348,0.7505,0.7675,0.7777,0.7943,0.8105,0.8274,0.8456,0.8623,0.8795,0.8903,0.9055,0.9222,0.9380,0.9554,0.9718,0.9886,1.0000,1.0000,1.0000,1.0000,1.0000,1.0000,1.0000,1.0000];
const CENTER_FRAME = 49; // 正面向きの静止区間の先頭（0始まり = frame_0050）。画面中央に対応
const ARC_C = ARC[CENTER_FRAME];
// 画面位置→首の動きの対応。左右の幅が違っても中央で回る速さが変わらないよう、
// 中央の傾きを左右共通にして、端に向かってなめらかに調整する（2次曲線）
const SLOPE = 1; // 中央での傾き（首の動き / 画面幅）
const K_L = 4*(SLOPE/2-ARC_C), K_R = 4*((1-ARC_C)-SLOPE/2);
const canvas = document.getElementById('viewCanvas');
const ctx = canvas.getContext('2d', {alpha:false});
const frames = new Array(FRAME_COUNT);
let current = 0.5; // 画面上の位置（0=左端〜1=右端）。ばねで滑らかに追従する
let velocity = 0;
let target = current;
let lastTime = performance.now();
let lastProgress = -1;
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';

function frameUrl(i){return `frames/frame_${String(i+1).padStart(4,'0')}.webp`;}
function resize(){
  const dpr=Math.min(devicePixelRatio||1,DPR_LIMIT);
  const w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);
  if(canvas.width!==w||canvas.height!==h){
    canvas.width=w;canvas.height=h;
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    lastProgress=-1;
  }
}
async function preload(){
  await Promise.all(Array.from({length: FRAME_COUNT}, async (_,i)=>{
    const img=new Image();
    img.decoding='async';
    img.src=frameUrl(i);
    try{ await img.decode(); }
    catch(e){
      // 大量同時デコードで decode() だけ失敗することがあるので、通常の読み込み完了で代用する
      if(!img.complete) await new Promise((ok,ng)=>{img.onload=ok;img.onerror=ng;});
    }
    frames[i]=img;
  }));
  resize();
  render(posToProgress(current));
  lastTime=performance.now();
  requestAnimationFrame(animate);
}
// 画面位置(0〜1) → 首の動きの累積(0〜1)。中央で傾きが連続するので速さの段差が出ない
function posToProgress(pos){
  const u=pos-0.5;
  const p=ARC_C+SLOPE*u+(u<0?K_L:K_R)*u*u;
  return Math.max(0,Math.min(1,p));
}
function setTarget(clientX){
  // 左端=左向き、中央=正面、右端=右向き
  target=Math.max(0,Math.min(1,clientX/Math.max(1,innerWidth)));
}
function drawFrame(img){
  const cw=canvas.width,ch=canvas.height;
  const scale=Math.max(cw/img.naturalWidth,ch/img.naturalHeight);
  const w=img.naturalWidth*scale,h=img.naturalHeight*scale;
  ctx.drawImage(img,(cw-w)/2,(ch-h)/2,w,h);
}
// 首の動きの累積値の位置にある前後2枚をクロスフェードして、コマ送りの段差をなくす
function render(p){
  let lo=0,hi=FRAME_COUNT-1; // ARC[lo] <= p < ARC[hi] を満たす区間を二分探索
  if(p>=ARC[hi]){lo=hi;}
  else{
    while(hi-lo>1){const mid=(lo+hi)>>1; if(ARC[mid]<=p) lo=mid; else hi=mid;}
  }
  const a=frames[lo]; if(!a)return;
  ctx.globalAlpha=1;
  drawFrame(a);
  if(lo<FRAME_COUNT-1){
    const span=ARC[lo+1]-ARC[lo];
    const t=span>0?(p-ARC[lo])/span:0;
    if(t>0.002&&frames[lo+1]){ctx.globalAlpha=t;drawFrame(frames[lo+1]);ctx.globalAlpha=1;}
  }
  lastProgress=p;
}
function animate(now){
  const dt=Math.min((now-lastTime)/1000,0.05); lastTime=now;
  // 臨界減衰ばね（SmoothDamp）で追従。動き出しも止まり際も加減速がなめらか
  const omega=2/SMOOTH_TIME, x=omega*dt;
  const exp=1/(1+x+0.48*x*x+0.235*x*x*x);
  const change=current-target;
  const temp=(velocity+omega*change)*dt;
  velocity=(velocity-omega*temp)*exp;
  current=target+(change+temp)*exp;
  if(Math.abs(target-current)<0.00005&&Math.abs(velocity)<0.0005){current=target;velocity=0;}
  const p=posToProgress(current);
  if(Math.abs(p-lastProgress)>0.00002) render(p);
  requestAnimationFrame(animate);
}
window.addEventListener('pointermove',e=>setTarget(e.clientX),{passive:true});
window.addEventListener('pointerdown',e=>setTarget(e.clientX),{passive:true});
window.addEventListener('resize',resize,{passive:true});
resize(); preload().catch(console.error);
})();
</script>
</body>
</html>
